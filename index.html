        body {
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            padding: 0;

        }

        #desktop {
            position: relative;
            width: 100vw;
            height: 100vh;

            color: white;

            align-items: center;
            justify-content: center;

            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);

            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            height: calc(100vh - 80px);
            gap: 15px;
            align-content: flex-start;
            z-index: 10;

            width: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;

            padding: 4px;
            border-radius: 4px;
            border: 1px solid transparent;

            border: 1px dotted rgba(255, 255, 255, 0.6);

            border: none;

            max-width: 90vw;
            height: fit-content;
            background: #0033d6;
            border-radius: 8px 8px 0 0;
            padding: 3px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);

        function startVerification() {
            if (isVerifying || isDesktopInitialized) return;
            isVerifying = true;

            const checkbox = document.getElementById('cf-checkbox');
            const checkmark = document.getElementById('cf-checkmark');
            const spinner = document.getElementById('cf-spinner');
            const gateway = document.getElementById('security-gateway');

            // 1. Cacher la case, montrer le spinner
            checkbox.classList.add('hidden');
            spinner.classList.remove('hidden');

            // 2. Simuler un temps d'analyse réseau
            setTimeout(() => {
                // Arrêter le spinner, montrer la coche verte
                spinner.classList.add('hidden');
                checkbox.classList.remove('hidden', 'border-gray-400');
                checkbox.classList.add('border-green-600');
                checkmark.classList.remove('hidden');

                    initDesktop();
                    gateway.style.opacity = '0';
                    setTimeout(() => {

            updateClock();
            setInterval(updateClock, 60000);

                    isMinimized: false,
                    x: offsetX,
                    y: offsetY

                createWindowDOM(data);

        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }

        function createDesktopIconDOM(data) {
            const iconBtn = document.createElement('div');
            iconBtn.className = 'desktop-icon';
            iconBtn.onclick = () => openWindow(data.id);

            const emojiEl = document.createElement('div');
            emojiEl.className = 'desktop-icon-emoji';
            emojiEl.innerText = data.emoji;

            const textEl = document.createElement('div');
            textEl.className = 'desktop-icon-text';
            textEl.innerText = data.title;

            iconBtn.appendChild(emojiEl);
            iconBtn.appendChild(textEl);
            desktopIconsContainer.appendChild(iconBtn);
        }

        function createWindowDOM(data) {
            const win = document.createElement('div');
            win.className = 'xp-window';
            win.id = `window-${data.id}`;
            win.style.left = `${windowsState[data.id].x}px`;
            win.style.top = `${windowsState[data.id].y}px`;

            const header = document.createElement('div');
            header.className = 'window-header';
            
            const titleSpan = document.createElement('span');
            titleSpan.innerText = `${data.title}`;
            
            const closeBtn = document.createElement('div');
            closeBtn.className = 'window-close';
            closeBtn.innerText = 'X';
            closeBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
            closeBtn.onclick = (e) => {
                e.stopPropagation();
                closeWindow(data.id);
            };

            header.appendChild(titleSpan);
            header.appendChild(closeBtn);

            const content = document.createElement('div');
            content.className = 'window-content';
            content.innerHTML = data.content;

            win.appendChild(header);
            win.appendChild(content);
            desktop.appendChild(win);

            win.addEventListener('pointerdown', () => focusWindow(data.id));
            makeDraggable(win, header, data.id);
        }

        function openWindow(id) {
            const win = document.getElementById(`window-${id}`);
            win.classList.add('open');
            win.style.display = 'flex';
            
            windowsState[id].isOpen = true;
            windowsState[id].isMinimized = false;
            
            let taskbarBtn = document.getElementById(`btn-${id}`);
            if (!taskbarBtn) {
                const data = portfolioData.find(d => d.id === id);
                createTaskbarButtonDOM(data);
            }
            
            focusWindow(id);
        }

        function createTaskbarButtonDOM(data) {
            const btn = document.createElement('button');
            btn.className = 'taskbar-btn active';
            btn.id = `btn-${data.id}`;
            btn.innerText = data.title;
            
            btn.addEventListener('click', () => {
                const win = document.getElementById(`window-${data.id}`);
                if (windowsState[data.id].isMinimized || win.style.zIndex != zIndexCounter) {
                    focusWindow(data.id);
                    win.style.display = 'flex';
                    windowsState[data.id].isMinimized = false;
                    btn.classList.add('active');
                } else {
                    minimizeWindow(data.id);
                }
            });
            
            taskbarItemsContainer.appendChild(btn);
        }

        function closeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            win.classList.remove('open');
            
            setTimeout(() => {
                if(!windowsState[id].isOpen) {
                    win.style.display = 'none';
                    if (btn) btn.remove();
                }
            }, 200);
            
            windowsState[id].isOpen = false;
        }

        function minimizeWindow(id) {
            const win = document.getElementById(`window-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            win.style.display = 'none';
            windowsState[id].isMinimized = true;
            if (btn) btn.classList.remove('active');
        }

        function focusWindow(id) {
            if (!windowsState[id].isOpen || windowsState[id].isMinimized) return;
            zIndexCounter++;
            const win = document.getElementById(`window-${id}`);
            win.style.zIndex = zIndexCounter;
            
            document.querySelectorAll('.taskbar-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`btn-${id}`);
            if (btn) btn.classList.add('active');
        }

        function makeDraggable(windowEl, headerEl, id) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            headerEl.addEventListener('pointerdown', dragStart);

            function dragStart(e) {
                if (window.innerWidth <= 768) return;
                if (e.target.className === 'window-close') return;
                
                isDragging = true;
                headerEl.style.cursor = 'grabbing';
                
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = windowEl.offsetLeft;
                initialTop = windowEl.offsetTop;

                document.addEventListener('pointermove', drag);
                document.addEventListener('pointerup', dragEnd);
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();

                let newLeft = initialLeft + (e.clientX - startX);
                let newTop = initialTop + (e.clientY - startY);

                if (newTop < 0) newTop = 0; 
                
                windowEl.style.left = `${newLeft}px`;
                windowEl.style.top = `${newTop}px`;
                windowsState[id].x = newLeft;
                windowsState[id].y = newTop;
            }

            function dragEnd() {
                isDragging = false;
                headerEl.style.cursor = 'default';
                document.removeEventListener('pointermove', drag);
                document.removeEventListener('pointerup', dragEnd);
            }
        }
    </script>
</body>
</html>
